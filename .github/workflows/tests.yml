# Runs the core and GUI test suites on Windows for every pull request and every push to main.
# The suites use isolated fixtures under .test-runs; a failed run keeps them and uploads them.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only, whatever the repository's default: the tests run code from the pull request.
permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to exact commits (the release in the comment), so a moved tag can't change them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Layer check
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\check-layers.ps1

      # Dependencies and build output are keyed on the lockfile, so only changed crates rebuild.
      - name: Cache Rust build (tests)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            native/m8-reader/target
          key: rust-${{ runner.os }}-tests-${{ hashFiles('native/m8-reader/Cargo.lock', 'native/m8-reader/rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-tests-

      - name: M8 reader tests (Rust)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\build-native.ps1 -Test

      - name: Core tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-tests.ps1

      - name: Native dependency loading policy
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-native-import-tests.ps1

      - name: GUI tests
        if: success() || failure()
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-gui-tests.ps1

      - name: Keep fixtures of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-test-fixtures
          path: .test-runs
          if-no-files-found: ignore
          retention-days: 7

  # Runs beside the tests so the slower Rust checks don't extend the wait.
  rust-checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dependencies and build output are keyed on the lockfile, so only changed crates rebuild.
      - name: Cache Rust build (checks)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            native/m8-reader/target
          key: rust-${{ runner.os }}-checks-${{ hashFiles('native/m8-reader/Cargo.lock', 'native/m8-reader/rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-checks-

      - name: M8 reader lint and deeper fuzzing (Rust)
        shell: powershell
        working-directory: native\m8-reader
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --release -- --ignored

      # Compiling cargo-audit takes minutes; its binary is cached under its version.
      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: cargo-audit-0.22.2-${{ runner.os }}

      - name: Rust dependency audit
        shell: powershell
        working-directory: native\m8-reader
        run: |
          if (-not (Test-Path "$env:USERPROFILE\.cargo\bin\cargo-audit.exe")) { cargo install cargo-audit --version 0.22.2 --locked }
          cargo audit

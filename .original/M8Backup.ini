; M8 Backup settings
;
; BackupFolder: where backups go. Each backup is saved to
;   <BackupFolder>\M8 Backups\<date>
; Leave it empty to use your Music folder. Environment variables work,
; e.g. BackupFolder=%USERPROFILE%\Documents or BackupFolder=D:\Backups
BackupFolder=

; Mode: what to do when there is already a backup.
;   ask         = show a menu: full backup, incremental backup or restore
;   full        = always make a new full backup
;   incremental = always copy new and changed files into the last backup
; To restore when Mode isn't ask, run: M8Backup.exe --restore
Mode=ask

; Verify: yes = read every copied file back and compare its SHA-256 checksum
; with the original, to catch bad copies (slower). no = skip this.
Verify=yes

; KeepBackups: how many backup folders to keep. After a successful backup the
; oldest extra ones are moved to the Recycle Bin (you're asked first). 0 = keep all.
KeepBackups=0

; MaxNameLength: warn about file and folder names longer than this, which may not
; show or load properly on the M8. 0 = don't check the length.
MaxNameLength=64

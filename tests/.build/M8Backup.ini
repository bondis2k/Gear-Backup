BackupFolder=C:\Users\tbond\AI\M8\.test-runs\ec911394dc13434fae85969a454ad2ab
Mode=full
Preview=no
Recovery=no
Thorough=yes

; RecoveryFolder: destination for dated recovery folders. Empty = <BackupFolder>\M8 Recovery.
; Environment variables work. Must be outside the source card/folder.
RecoveryFolder=

; SourceFolder: optional SD card drive or folder, e.g. E:\ or D:\M8Card.
; Empty = detect the M8, or offer manual selection if detection fails.
SourceFolder=

; Profile: separate history name for this card (letters, digits, spaces, - and _).
; Empty = automatic volume serial / folder identity. Use a fixed name when changing readers.
Profile=

; Verify: yes = read every copied file back and compare its SHA-256 checksum
; with the original, to catch bad copies (slower). no = skip this.
Verify=yes

; KeepBackups: how many backup folders to keep. After a successful backup the
; oldest extra ones are moved to the Recycle Bin (you're asked first). 0 = keep all.
KeepBackups=0

; MaxNameLength: warn about file and folder names longer than this, which may not
; show or load properly on the M8. 0 = don't check the length.
MaxNameLength=64

; Eject: what to do with the M8 when a backup or restore is finished.
;   no  = leave it connected, don't ask
;   ask = ask in a notification (or press Y/N in the window)
;   yes = always eject it, don't ask
Eject=no

; KeepOldVersions: how many old versions of each file to keep in a backup, when
; incremental backups rename changed files (Song_2026-10-01_143000.m8s). After an
; incremental backup the oldest extra ones are moved to the Recycle Bin (you're
; asked first). 0 = keep all.
KeepOldVersions=0

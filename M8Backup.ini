; M8 Backup settings
;
; BackupFolder: where backups go. Each backup is saved to
;   <BackupFolder>\M8 Backups\<date>
; Leave it empty to use your Music folder. Environment variables work,
; e.g. BackupFolder=%USERPROFILE%\Documents or BackupFolder=D:\Backups
BackupFolder=

; Mode: what to do when there is already a backup.
;   ask         = show a menu: full backup, incremental backup or restore
;   full        = always make a new full backup
;   incremental = always copy new and changed files into the last backup
; To restore when Mode isn't ask, run: M8Backup.exe --restore
Mode=ask

; Verify: yes = read every copied file back and compare its SHA-256 checksum
; with the original, to catch bad copies (slower). no = skip this.
Verify=yes

; KeepBackups: how many backup folders to keep. After a successful backup the
; oldest extra ones are moved to the Recycle Bin (you're asked first). 0 = keep all.
KeepBackups=0

; MaxNameLength: warn about file and folder names longer than this, which may not
; show or load properly on the M8. 0 = don't check the length.
MaxNameLength=64

; Save PC recovery copies before replacing/removing target files during restore.
; If recovery copying fails, the restore stops before changing the target.
Recovery=no

; Recovery destination. Empty = <BackupFolder>\M8 Recovery.
; Example: RecoveryFolder=D:\M8 Recovery
; Environment variables work. Must be outside the source card/folder.
RecoveryFolder=

; Optional SD-card drive or folder. Empty = detect M8, then offer manual selection.
; Example: SourceFolder=E:\ or SourceFolder=D:\M8Card
SourceFolder=

; History name for this card. Empty = automatic volume serial / folder identity.
; Use a fixed name when changing readers or for separate collections.
Profile=

; Compare contents instead of only file size/modified time (slower).
; Interrupted backups always resume with content comparison.
Thorough=no

; Show a file plan and ask before copying. --preview only shows the plan.
Preview=yes

; Leave connected (no), ask before ejecting (ask), or eject automatically (yes).
Eject=no

; Limit visible dated old versions per file; 0 keeps all.
; Point-in-time history is retained separately until the entire backup is removed.
KeepOldVersions=0
